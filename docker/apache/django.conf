<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    
    WSGIDaemonProcess medisafe python-path=/app python-home=/usr
    WSGIProcessGroup medisafe
    WSGIApplicationGroup %{GLOBAL}
    
    WSGIScriptAlias / /app/capstone/wsgi.py
    
    <Directory /app/capstone>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    
    WSGIPassAuthorization On
    
    # Static files - Apache serves directly (more efficient)
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles/>
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>
    
    # Media files
    Alias /media/ /app/media/
    <Directory /app/media/>
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>
    
    # Security headers (matching your Windows config style)
    <IfModule headers_module>
        RequestHeader unset Proxy early
    </IfModule>
    
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>